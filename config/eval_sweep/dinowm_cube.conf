# ===========================================================================
#  Table 2, OGB-Cube: DINO-WM (image), trained with dinowm_swm
#
#  eval.py plans with the released DINO-WM checkpoint (checkpoints/<env>/dino-wm/, in
#  the layout dinowm_swm/train.py writes) through the same sequence-matched image protocol
#  (config/eval/image_cube.yaml); cache_dir= is that folder (or your own dinowm_swm run).
#
#  Run from the repository root:
#      pixi run bash scripts/run_sweep.sh config/eval_sweep/<this file>   [--dry-run] [--seeds "1 42"]
#      python scripts/summarize_evals.py eval_results/<SWEEP_NAME>
#
#  Every entry of EVALS is "<label> | <hydra overrides>"; each label is run at
#  every seed in SEEDS with NUM_EVAL episodes. The seed decides which 50
#  start-goal windows are drawn (paired across all models), so report the mean
#  and standard deviation over seeds.
# ===========================================================================

SWEEP_NAME=dinowm_cube
EVAL_CONFIG=image_cube
EVAL_TASK=eval
NUM_EVAL=50
SEEDS=(1 25 35 36 40 42 65 80 83 99)

EVALS=(
  "dinowm | cache_dir=checkpoints/cube/dino-wm policy=model_latest.pth"
)
COMMON_OVERRIDES=(
)
SAVE_VIDEOS=false
