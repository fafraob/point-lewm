# ===========================================================================
#  Table 2, Reacher: LeWM (image) re-evaluated from its released checkpoint
#
#  eval.py plans with the image LeWM checkpoint of Maes et al. under
#  checkpoints/image_lewm_<env>/ (scripts/download_checkpoints.py --image-lewm) on the SAME re-sensed dataset and the same start-goal
#  windows as the point-cloud sweeps (config/eval/image_reacher.yaml).
#
#  Run from the repository root:
#      pixi run bash scripts/run_sweep.sh config/eval_sweep/<this file>   [--dry-run] [--seeds "1 42"]
#      python scripts/summarize_evals.py eval_results/<SWEEP_NAME>
#
#  Every entry of EVALS is "<label> | <hydra overrides>"; each label is run at
#  every seed in SEEDS with NUM_EVAL episodes. The seed decides which 50
#  start-goal windows are drawn (paired across all models), so report the mean
#  and standard deviation over seeds.
# ===========================================================================

SWEEP_NAME=image_reacher
EVAL_CONFIG=image_reacher
EVAL_TASK=eval
NUM_EVAL=50
SEEDS=(1 25 35 36 40 42 65 80 83 99)

EVALS=(
  "image_lewm | policy=image_lewm_reacher"
  "random     | policy=random"
)
COMMON_OVERRIDES=(
)
SAVE_VIDEOS=false
