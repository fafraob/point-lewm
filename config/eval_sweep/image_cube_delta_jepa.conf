# ===========================================================================
#  Table 2, OGB-Cube: Delta-JEPA (image)
#
#  eval.py plans with the released image Delta-JEPA checkpoint
#  (checkpoints/cube/image-delta-jepa/, our re-implementation trained with
#  config/train/image_delta_jepa_cube.yaml) on the SAME dataset and the same start-goal
#  windows as every other row of the dataset (config/eval/image_cube.yaml). For a run
#  of your own: run=image_delta_jepa_cube policy=image_delta_jepa_cube/weights_final.pt.
#
#  `random` stays in the sweep: it is the only way to tell a real planner from
#  an evaluation protocol that succeeds at reset, it is cheap, and it is scored
#  on these very seeds, so it is the control that belongs next to this number.
#
#  Run from the repository root:
#      pixi run bash scripts/run_sweep.sh config/eval_sweep/<this file>   [--dry-run] [--seeds "1 42"]
#      python scripts/summarize_evals.py eval_results/<SWEEP_NAME>
#
#  Every entry of EVALS is "<label> | <hydra overrides>"; each label is run at
#  every seed in SEEDS with NUM_EVAL episodes. The seed decides which 50
#  start-goal windows are drawn (paired across all models), so report the mean
#  and standard deviation over seeds.
# ===========================================================================

SWEEP_NAME=image_cube_delta_jepa
EVAL_CONFIG=image_cube
EVAL_TASK=eval
NUM_EVAL=50
SEEDS=(1 25 35 36 40 42 65 80 83 99)

EVALS=(
  "image_delta_jepa | cache_dir=. policy=cube/image-delta-jepa/weights.pt"
  "random           | policy=random"
)
COMMON_OVERRIDES=(
)
SAVE_VIDEOS=false
