# ===========================================================================
#  Table 2, Push-T: Point-LeWM, Point-Delta-JEPA and the Random baseline
#
#  Closed-loop CEM planning toward the recorded goal cloud (eval_lidar.py,
#  config/eval/lidar_pusht.yaml). cache_dir=. policy=<env>/<model>/weights.pt addresses
#  the released checkpoints under checkpoints/ (scripts/download_checkpoints.py);
#  run=<run folder> policy=<export inside it> evaluates a training run of your own.
#
#  Run from the repository root:
#      pixi run bash scripts/run_sweep.sh config/eval_sweep/<this file>   [--dry-run] [--seeds "1 42"]
#      python scripts/summarize_evals.py eval_results/<SWEEP_NAME>
#
#  Every entry of EVALS is "<label> | <hydra overrides>"; each label is run at
#  every seed in SEEDS with NUM_EVAL episodes. The seed decides which 50
#  start-goal windows are drawn (paired across all models), so report the mean
#  and standard deviation over seeds.
# ===========================================================================

SWEEP_NAME=lidar_pusht
EVAL_CONFIG=lidar_pusht
EVAL_TASK=eval-lidar
NUM_EVAL=50
SEEDS=(1 25 35 36 40 42 65 80 83 99)

EVALS=(
  "point_lewm      | cache_dir=. policy=pusht/point-lewm/weights.pt planner=cem"
  "point_delta_jepa | cache_dir=. policy=pusht/point-delta-jepa/weights.pt planner=cem"
  "random    | policy=random"
)
COMMON_OVERRIDES=(
)
SAVE_VIDEOS=false
