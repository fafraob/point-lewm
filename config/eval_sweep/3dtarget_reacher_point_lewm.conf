# ===========================================================================
#  Table 3, Reacher, Point-LeWM: planning toward 3D targets
#
#  eval_3dtarget.py replaces the goal cloud by a goal latent predicted from the
#  3D target: the four target-to-latent heads (MLP / shortcut, with and without
#  the current latent z_t) released next to their encoder under
#  checkpoints/<env>/<model>/target2latent/ (docs/reproduction.md), plus the goal-cloud
#  parity arm that encodes the recorded goal cloud through the same code path.
#  The start-goal windows are the pinned lists under eval_starts/, which are also
#  the episodes held out from head training.
#
#  Run from the repository root:
#      pixi run bash scripts/run_sweep.sh config/eval_sweep/<this file>   [--dry-run] [--seeds "1 42"]
#      python scripts/summarize_evals.py eval_results/<SWEEP_NAME>
#
#  Every entry of EVALS is "<label> | <hydra overrides>"; each label is run at
#  every seed in SEEDS with NUM_EVAL episodes. The seed decides which 50
#  start-goal windows are drawn (paired across all models), so report the mean
#  and standard deviation over seeds.
# ===========================================================================

SWEEP_NAME=3dtarget_reacher_point_lewm
EVAL_CONFIG=3dtarget_reacher
EVAL_TASK=eval-3dtarget
NUM_EVAL=50
SEEDS=(1 25 35 36 40 42 65 80 83 99)

CKPT="cache_dir=. policy=reacher/point-lewm/weights.pt"
M=checkpoints/reacher/point-lewm/target2latent
EVALS=(
  "t2l_mlp        | ${CKPT} target_goal.model_dir=${M}/mlp"
  "t2l_mlp_z      | ${CKPT} target_goal.model_dir=${M}/mlp_z"
  "t2l_shortcut   | ${CKPT} target_goal.model_dir=${M}/shortcut"
  "t2l_shortcut_z | ${CKPT} target_goal.model_dir=${M}/shortcut_z"
  "goalcloud      | ${CKPT} target_goal.goal_mode=true"
)
# starts_file is single-quoted so ${seed} stays literal: Hydra resolves it per
# item against the top-level seed, giving every seed its own pinned windows.
COMMON_OVERRIDES=(
  'eval.starts_file=eval_starts/starts_reacher_seed${seed}.json'
  target_goal.video=false
)
SAVE_VIDEOS=false
