# ===========================================================================
#  Table 2, Two-Room: Utonia-WM
#
#  Closed-loop CEM planning of the Utonia-WM arm (eval_lidar.py,
#  config/eval/utoniawm_tworoom.yaml). The Utonia-WM predictor rolls out a token grid,
#  so one evaluation takes considerably longer than for the end-to-end models.
#
#  Run from the repository root:
#      pixi run bash scripts/run_sweep.sh config/eval_sweep/<this file>   [--dry-run] [--seeds "1 42"]
#      python scripts/summarize_evals.py eval_results/<SWEEP_NAME>
#
#  Every entry of EVALS is "<label> | <hydra overrides>"; each label is run at
#  every seed in SEEDS with NUM_EVAL episodes. The seed decides which 50
#  start-goal windows are drawn (paired across all models), so report the mean
#  and standard deviation over seeds.
# ===========================================================================

SWEEP_NAME=utoniawm_tworoom
EVAL_CONFIG=utoniawm_tworoom
EVAL_TASK=eval-lidar
NUM_EVAL=50
SEEDS=(1 25 35 36 40 42 65 80 83 99)

EVALS=(
  "utoniawm | cache_dir=. policy=tworoom/utonia-wm/weights.pt planner=cem"
)
COMMON_OVERRIDES=(
)
SAVE_VIDEOS=false
