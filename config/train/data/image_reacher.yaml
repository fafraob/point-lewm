# Reacher IMAGE dataset -- the pixel sibling of lidar_reacher.yaml, and the
# table the released image LeWM checkpoint was trained on (`reacher.h5`, HF repo
# quentinll/lewm-reacher, docs/data.md). It lives under $PLWM_DATA_ROOT
# (default <repo>/data); override per run with
# `data.dataset.name=/path/to/file.h5`.
#
# 1,720,000 six-frame windows, `pixels` at 224x224 and `action` width 2, so
# train.py sets action_encoder.input_dim = 5 x 2 = 10. That window count is
# exactly what reacher.lance (2,010,000 frames, 10,000 episodes) predicts under
# the same windowing, so this file and the LiDAR table hold the same episodes.
#
# The env is dm_control's reacher (swm/ReacherDMControl-v0), which is what
# config/eval/image_reacher.yaml plans in.
#
# config/eval/image_reacher.yaml plans on reacher.lance, whose `pixels` column
# is this file's image data copied verbatim by lidar_from_h5.py.
#
# Loads pixels + action only: the JEPA reads exactly those two columns
# (jepa.encode), so `observation` would cost IO and a z-score pass for nothing.
dataset:
  name: ${oc.env:PLWM_DATA_ROOT,data}/reacher.h5
  # Overridden by the Delta-JEPA config to ldad_horizon + 1 = 6 frames.
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  keys_to_load:
    - pixels
    - action
  keys_to_cache:
    - action

# NO `obs:` block -- its absence selects the image path in train.py.
