defaults:
  - _self_
  - launcher: local
  - data: utonia_emb_tworoom
  - model: utoniawm_tworoom

# Utonia-WM (frozen Utonia encoder, DINO-WM recipe) on the TWO-ROOM lidar
# dataset. Identical protocol to config/train/utoniawm_cube.yaml (the cube arm) --
# only the dataset/cache, the environment-geometry numbers in the model config
# and the token grid resolution differ, so the cube and two-room runs sit on
# the same 100-epoch, effective-batch-512 protocol.
#
# BEFORE the first run (once per machine): build the frozen token cache with
#   pixi run python precompute_utonia.py --config-name=utoniawm_tworoom
# Training refuses to start without it.
# Run with: pixi run train --config-name=utoniawm_tworoom run_name=utoniawm_tworoom

output_model_name: utoniawm_tworoom
subdir: ${hydra:job.id}

# Unused by this arm; kept so shared tooling that reads the key keeps working.
pretrained_ckpt: null

num_workers: 6
train_split: 0.9
seed: 3072
# Per-TOKEN latent width (see utoniawm_cube.yaml).
embed_dim: 192
history_size: 3

# Token grid resolution (see model/utoniawm_tworoom.yaml for the derivation).
# 10 x 9 x 3 = 270 tokens per frame -- wide flat scene with 0-20 cm walls, so
# xy gets most of the budget with three z layers (ground / body / wall top).
grid_x: 10
grid_y: 9
grid_z: 3
num_tokens: ${eval:'${grid_x} * ${grid_y} * ${grid_z}'}

trainer:
  # Follows utoniawm_cube.yaml (the cube arm) -- keep the two in sync.
  max_epochs: 100
  devices: 2
  strategy: ddp_find_unused_parameters_true
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

accumulate_grad_batches: 1

loader:
  # PER RANK (see utoniawm_cube.yaml): a 2-GPU run gives 2 x 256 x 1 =
  # effective batch 512; a 1-GPU run must override loader.batch_size=512
  # (or add ++accumulate_grad_batches=2) to match.
  batch_size: 256
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 1e-3  # follows utoniawm_cube.yaml (the cube arm)
  weight_decay: 1e-3

num_preds: 1

# Prediction loss only (frozen targets -- see utoniawm_cube.yaml).
loss: {}
