defaults:
  - _self_
  - launcher: local
  - data: utonia_emb_reacher
  - model: utoniawm_reacher

# Utonia-WM (frozen Utonia encoder, DINO-WM recipe) on the REACHER lidar
# dataset. Identical protocol to config/train/utoniawm_cube.yaml (the cube arm) --
# only the dataset/cache and the environment-geometry numbers in the model
# config differ; the token grid even keeps the cube's 8x8x4, so the cube and
# reacher runs sit on the same 100-epoch, effective-batch-512 protocol with the
# same token count.
#
# BEFORE the first run (once per machine): build the frozen token cache with
#   pixi run python precompute_utonia.py --config-name=utoniawm_reacher
# Training refuses to start without it.
# Run with: pixi run train --config-name=utoniawm_reacher run_name=utoniawm_reacher

output_model_name: utoniawm_reacher
subdir: ${hydra:job.id}

# Unused by this arm; kept so shared tooling that reads the key keeps working.
pretrained_ckpt: null

num_workers: 6
train_split: 0.9
seed: 3072
# Per-TOKEN latent width (see utoniawm_cube.yaml).
embed_dim: 192
history_size: 3

# Token grid resolution (see model/utoniawm_reacher.yaml for the derivation).
# 8 x 8 x 4 = 256 tokens per frame, same as the cube arm and DINO-WM's patch
# count -- the reacher workspace is small enough that the cube grid shape
# carries over (verdict from viz_grid.py).
grid_x: 8
grid_y: 8
grid_z: 4
num_tokens: ${eval:'${grid_x} * ${grid_y} * ${grid_z}'}

trainer:
  # Follows utoniawm_cube.yaml (the cube arm) -- keep the two in sync.
  max_epochs: 100
  devices: 2
  strategy: ddp_find_unused_parameters_true
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

accumulate_grad_batches: 1

loader:
  # PER RANK (see utoniawm_cube.yaml): a 2-GPU run gives 2 x 256 x 1 =
  # effective batch 512; a 1-GPU run must override loader.batch_size=512
  # (or add ++accumulate_grad_batches=2) to match.
  batch_size: 256
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 1e-3  # follows utoniawm_cube.yaml (the cube arm)
  weight_decay: 1e-3

num_preds: 1

# Prediction loss only (frozen targets -- see utoniawm_cube.yaml).
loss: {}
