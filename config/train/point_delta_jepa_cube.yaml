# Point-Delta-JEPA: Delta-JEPA on the plain PointViT stack (ground KEPT):
# point_lewm with SIGReg REPLACED by the Latent Difference Action Decoder
# -- loss = pred + lambda * || D(z_{t+N} - z_t) - a_{t..t+N-1} ||^2.
# Windows are extended 4 -> 6 frames so LDAD spans the paper's horizon N=5,
# and the predictor teacher-forces across the FULL window (5 context positions
# predicting frames 1..5), so every frame and every in-window action carries
# gradient. NOTE this widens the predictor's trained context 3 -> 5 vs the
# LeWM baselines (pos-embedding length follows history_size); closed-loop eval
# is unaffected -- jepa.rollout truncates context to its own history_size=3
# default, which matches training position 2 exactly (causal, left-aligned).
# Run with: pixi run train --config-name=point_delta_jepa_cube run_name=point_delta_jepa_cube
defaults:
  - launcher: local
  - data: lidar_cube
  - model: point_delta_jepa_cube
  - _self_   # last, so the data.dataset.num_steps override below wins

output_model_name: point_delta_jepa_cube
subdir: ${hydra:job.id}

# Unused by the PointViT encoder (no pretrained weights exist for it); kept so
# shared tooling that reads the key keeps working.
pretrained_ckpt: null

num_workers: 6
train_split: 0.9
seed: 3072
embed_dim: 192

# LDAD horizon N: actions decoded per latent displacement. The single knob
# that sizes the whole window protocol: num_steps = N + 1 frames, and
# history_size (teacher-forcing context = predictor pos-embedding length)
# follows as num_steps - num_preds, so the prediction loss covers every
# adjacent pair of the window and no frame is left without gradient.
ldad_horizon: 5
history_size: ${eval:'${ldad_horizon} + 1 - ${num_preds}'}

data:
  dataset:
    num_steps: ${eval:'${ldad_horizon} + 1'}

trainer:
  # OGB-Cube: the 50-epoch cosine schedule of the paper (the other three
  # environments train for 10 epochs). Exports are written every epoch
  # (weights_epoch_N.pt, weights_final.pt = the newest).
  max_epochs: 50
  devices: 2
  strategy: ddp_find_unused_parameters_true
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

# Effective batch 128 (= the point_lewm baselines) = 2 GPUs x per-GPU batch 32 x 2
# accumulation steps. A single-step batch of 128 six-frame windows does not fit
# a 48 GB GPU (~45 GB allocated when the checkpointed tokenizer recompute hits
# the backward pass).
# Equivalence to a true bs=128 step is exact here BECAUSE sigreg is gone -- no
# remaining loss term sees batch statistics -- and train.py averages the
# accumulated loss and sizes the cosine schedule in optimizer steps.
accumulate_grad_batches: 2

loader:
  # Per-GPU micro-batch of 32 six-frame windows. Keep
  # devices x batch_size x accumulate_grad_batches = 128.
  batch_size: 32
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5  # matches the point_lewm baselines AND the paper's Delta-JEPA lr
  weight_decay: 1e-3

num_preds: 1

loss:
  # Faithful Delta-JEPA: NO sigreg block -- LDAD is the anti-collapse
  # mechanism (paper: "no distribution-matching regularizers"). For the
  # controlled LeWM+LDAD ablation add back
  #   sigreg: {weight: 0.09, kwargs: {knots: 17, num_proj: 1024}}
  action:
    weight: 10.0  # paper's lambda (their Fig. 3: flat over [1, 100]; 0 / 0.1 collapse)
