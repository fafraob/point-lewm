defaults:
  - launcher: local
  - solver: cem
  - _self_

# Lidar (point-cloud) eval for the pusht arm -- point-cloud sibling of
# config/eval/image_pusht.yaml, structured like lidar_cube.yaml.
#
# THE ENV IS NOT swm/PushT-v1. That one is 2D pymunk with no MuJoCo model, and
# AddRaycastLidarWrapper (mj_multiRay) refuses it. The lidar dataset was written
# against swm/PushTLidar-v1, the MuJoCo *mirror* of the same env
# (stable_worldmodel/envs/pusht/lidar_env.py): identical pymunk dynamics, plus a
# rebuilt MuJoCo scene the sensor can raycast.
#
# The mirror env, the `iso` camera and `match_camera_fov` live in the vendored
# stable-worldmodel/ package.
#
# `world.iso_*` and `lidar.sensor` are copied from the config that GENERATED the
# dataset -- stable-worldmodel's scripts/data/config/lidar_from_h5_pusht.yaml
# -- and must stay in sync with it.

world:
  env_name: swm/PushTLidar-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set by eval_lidar.py to 2 * eval_budget
  # --- env kwargs, forwarded by swm.World to the mirror env ---
  # The goal T is drawn in the RGB image but kept OUT of the mirror geometry, so
  # it never appears in the cloud -- exactly how the dataset was collected.
  goal_lidar_height: null
  # Oblique sensor bearing; the `iso` camera is framed on the arena from here
  # and the scan inherits its fov (match_camera_fov), so these are part of the
  # sensor definition.
  iso_azimuth: 45.0
  iso_elevation: 45.0

dataset:
  # columns to z-score and expose to the policy (the lidar cloud is used raw)
  stats_keys:
    - action

seed: 42
# Planner mode (Delta-JEPA checkpoints required for the ldad modes):
#   cem       plain CEM from a zero-initialized sampling mean
#   ldad_cem  CEM warm-started with LDAD-decoded actions D(z_goal - z_now)
#             (see LidarLDADPlanAdapter)
#   ldad      the decoded plan executed directly each replan -- no CEM
#             (see LDADSolver; isolates the decoder as an amortized policy)
# eval_lidar.py defaults this to cem when absent, but Hydra's struct mode then
# rejects a plain `planner=...` override ("Key 'planner' is not in struct"), so
# the key is declared here -- a sweep must be able to set it.
planner: cem
# ckpt path relative to <run>/checkpoints/, or `random` for the baseline.
# Checkpoint to evaluate, relative to <cache_dir>/checkpoints/ (or `random`).
# Default: the released checkpoints downloaded into <repo>/checkpoints/<env>/<model>/
# (scripts/download_checkpoints.py), e.g. policy=pusht/point-lewm/weights.pt.
# For a training run of your own, run=<folder under logs_root> selects
# <logs_root>/<run>/checkpoints/<policy> instead (run= takes precedence).
policy: pusht/point-delta-jepa/weights.pt
logs_root: ${oc.env:PLWM_LOGS_ROOT,experiment_logs}
run: null
cache_dir: ${hydra:runtime.cwd}

# must match training: history_size=3 frames, frameskip=5 (action_block)
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip, == config/train/data/lidar_pusht.yaml

lidar:
  key: lidar # env info key; the dataset goal arrives as goal_${.key}
  in_channels: 3 # xyz per point (30000 / 3 = 10000), confirmed on the dataset
  # Confirmed on the dataset: exactly 2000 of the 10000 points per frame are
  # (-1,-1,-1). MUST match the ckpt's training config.
  invalid_value: -1.0
  # AddRaycastLidarWrapper kwargs == lidar_from_h5_pusht.yaml's `lidar` block.
  sensor:
    h_res: 100
    v_res: 100
    match_camera_fov: true # ray grid comes from the iso camera's fov
    backend: mujoco # the mirror is rebuilt per episode; warp would cache it
    mount_camera: iso
    frame: sensor
    max_range: 12.0 # eye-to-far-corner is ~6.5 m from the iso pose
    miss_value: -1.0 # sensor property; invalid_value above decides dropping
    include_static: true
    add_goal_lidar: false # goal clouds come from the dataset
    add_rgb: false # no colors in this dataset (the render is top-down)
  # Eval-time sensor degradation -- the noise / dropout ablations. NOT part of
  # `sensor` above: that block reproduces the scan that generated the training
  # dataset and must stay faithful to it, while this one deliberately makes the
  # scan worse to measure how far the world model survives it. Defaults are
  # no-ops, so an unmodified eval behaves exactly as before.
  perturb:
    # Gaussian range noise (along each point's line of sight), sigma as a
    # FRACTION of that frame's scan bounding-box diagonal. Relative because an
    # absolute sigma is not comparable across these arenas -- 2 cm is a haze on
    # Push-T (4.9 m across) and a catastrophe on reacher (1.4 m).
    #   0.0025 -> ~0.33x the median point spacing in every env
    #   0.005  -> ~0.67x the spacing; surfaces soften but stay surfaces
    # Both stay BELOW the spacing on purpose: past it a point lands nearer a
    # different surface than its own and the scan dissolves rather than
    # degrades (at noise_frac 0.02 the Reacher scan dissolves and planning
    # largely fails).
    noise_frac: 0.0
    # Fraction of returns marked as misses. They leave through the same
    # invalid_value filter as genuine misses, so the model simply sees fewer
    # points -- which is what a lost return is.
    dropout_prob: 0.0
    # What gets degraded. The goal cloud comes from the DATASET, not the
    # sensor, so it stays clean unless asked for:
    #   obs   -- live observation only (bad sensor, stored target)
    #   both  -- goal too (tests the representation, but a failure no longer
    #            separates "cannot see" from "aiming at the wrong thing")
    scope: obs
    # null -> derive from the eval `seed`, so a sweep's seeds give different
    # noise realisations and each one replays exactly.
    seed: null

# evaluation from dataset (replay expert trajectories)
# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  # See lidar_tworoom.yaml. Pusht episodes run 49-246 steps (median 123), so a
  # cap of 20 keeps starts well before the expert finishes; null disables it.
  max_start_step: null
  # eval.min_goal_displacement is CUBE-ONLY (hardcoded `privileged/block_0_pos`).
  img_size: 224 # must equal the stored pixels resolution
  dataset_name: ${oc.env:PLWM_DATA_ROOT,data}/pusht.lance
  # Same callables as image_pusht.yaml -- env API calls, identical for the lidar
  # arm. The lidar dataset carries state[7], which is what
  # these read; PushTLidarEnv overrides _set_state and inherits _set_goal_state.
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state (goal_* keys come from the dataset slice end state)
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  # directory for results + videos. scripts/run_sweep.sh sets this per (checkpoint, seed).
  dir: ${oc.env:PLWM_RESULTS_ROOT,eval_results}
  filename: lidar_pusht_results.txt
