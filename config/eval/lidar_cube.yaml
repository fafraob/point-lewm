defaults:
  - launcher: local
  - solver: cem
  - _self_

# Lidar (point-cloud, geometry only) eval for the OGB-Cube arm. The env itself
# has no lidar sensor; eval_lidar.py wraps it with stable-worldmodel's
# AddRaycastLidarWrapper, configured (lidar.sensor) to the exact camera-matched
# sensor that generated the training dataset (lidar_from_h5.yaml). Run with:
#   python eval_lidar.py --config-name=lidar_cube policy=cube/point-lewm/weights.pt
#   python eval_lidar.py --config-name=lidar_cube run=point_lewm_cube policy=point_lewm_cube/weights_final.pt  # a run of your own

world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set by eval_lidar.py to 2 * eval_budget
  env_type: single
  ob_type: states
  multiview: False
  # raw env render resolution; MegaWrapper downsizes rendered pixels to
  # eval.img_size (which must equal the dataset's stored pixel resolution).
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: True

dataset:
  # columns to z-score and expose to the policy (lidar + colors are used raw)
  stats_keys:
    - action

seed: 42
# Planner mode (Delta-JEPA checkpoints required for the ldad modes):
#   cem       plain CEM from a zero-initialized sampling mean
#   ldad_cem  CEM warm-started with LDAD-decoded actions D(z_goal - z_now)
#             (see LidarLDADPlanAdapter)
#   ldad      the decoded plan executed directly each replan -- no CEM
#             (see LDADSolver; isolates the decoder as an amortized policy)
planner: cem
policy: cube/point-delta-jepa/weights.pt # relative to <cache_dir>/checkpoints/ (or <run>/checkpoints/), or random
# Which checkpoint folder to evaluate. Default: the released checkpoints
# downloaded into <repo>/checkpoints/<env>/<model>/ (scripts/download_checkpoints.py),
# e.g. policy=cube/point-lewm/weights.pt or policy=cube/utonia-wm/weights.pt.
# For a training run of your own, run=<folder under logs_root> selects
# <logs_root>/<run>/checkpoints/<policy> instead (run= takes precedence).
logs_root: ${oc.env:PLWM_LOGS_ROOT,experiment_logs}
run: null
cache_dir: ${hydra:runtime.cwd}

# must match training: history_size=3 frames, frameskip=5 (action_block)
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

lidar:
  key: lidar # env info key; the dataset goal arrives as goal_${.key}
  in_channels: 3
  # Plain-lidar ckpts: no colors are packed for the model, and the lidar
  # video panels render depth-colored -- exactly what the model sees.
  contains_rgb: false
  # Points with all coords == this are dropped before encoding. MUST match the
  # ckpt's training data config: the RGB configs drop misses (invalid_value
  # -1.0) so the -1 rgb fill never enters the per-voxel color mean.
  invalid_value: -1.0
  # swm AddRaycastLidarWrapper kwargs -- MUST match the sensor that generated the
  # eval dataset. Ground truth is stable-worldmodel/scripts/data/config/lidar_from_h5.yaml:
  # a 100x100 camera-matched grid (rays through the pixel centers of the
  # front_pixels camera, so every hit has a color), sensor-frame points,
  # miss_value -1.0, min_alpha 0.5, add_rgb. Goal lidar (+ colors) comes from
  # the dataset (dataset-driven eval), not from the env task state.
  sensor:
    h_res: 100
    v_res: 100
    # Scan pattern rides the camera frustum (h_fov/v_fov would be ignored).
    match_camera_fov: true
    frame: sensor
    # cube.lance was generated with the warp (GPU) backend; warp reproduces its
    # clouds bit-exactly, while mj_multiRay casts analytic primitives vs warp's
    # triangle meshes -- ~4% of rays differ >1mm, ~9 rays/cloud land >10cm off
    # on curved silhouettes (arm). Keep warp so eval sees the training sensor.
    backend: warp
    # Fill value for missed rays: the wrapper always emits exactly h_res*v_res
    # = 10000 points, with no-hit rays filled at (-1,-1,-1). MUST stay -1.0 to
    # match how the dataset was generated (lidar_from_h5.yaml) -- it is a sensor
    # property; invalid_value above decides dropping (here they coincide).
    miss_value: -1.0
    mount_camera: front_pixels
    add_goal_lidar: false
    # No colors: the model is geometry-only, so skip the per-step camera
    # render the rgb sampling would cost (the dataset's lidar_rgb column is
    # simply ignored; panels depth-color via lidar_render_rgb=false).
    add_rgb: false
    # Rays pass *through* geoms with rgba alpha < min_alpha. The arena walls are
    # alpha 0.1; floor/cube/robot are 1.0 -- so 0.5 drops the walls only. This
    # matches the conversion config (lidar_from_h5.yaml also uses min_alpha 0.5), so the
    # live clouds and the dataset clouds see the same geometry.
    min_alpha: 0.5
  # Eval-time sensor degradation -- the noise / dropout ablations. NOT part of
  # `sensor` above: that block reproduces the scan that generated the training
  # dataset and must stay faithful to it, while this one deliberately makes the
  # scan worse to measure how far the world model survives it. Defaults are
  # no-ops, so an unmodified eval behaves exactly as before.
  perturb:
    # Gaussian range noise (along each point's line of sight), sigma as a
    # FRACTION of that frame's scan bounding-box diagonal. Relative because an
    # absolute sigma is not comparable across these arenas -- 2 cm is a haze on
    # Push-T (4.9 m across) and a catastrophe on reacher (1.4 m).
    #   0.0025 -> ~0.33x the median point spacing in every env
    #   0.005  -> ~0.67x the spacing; surfaces soften but stay surfaces
    # Both stay BELOW the spacing on purpose: past it a point lands nearer a
    # different surface than its own and the scan dissolves rather than
    # degrades (at noise_frac 0.02 the Reacher scan dissolves and planning
    # largely fails).
    noise_frac: 0.0
    # Fraction of returns marked as misses. They leave through the same
    # invalid_value filter as genuine misses, so the model simply sees fewer
    # points -- which is what a lost return is.
    dropout_prob: 0.0
    # What gets degraded. The goal cloud comes from the DATASET, not the
    # sensor, so it stays clean unless asked for:
    #   obs   -- live observation only (bad sensor, stored target)
    #   both  -- goal too (tests the representation, but a failure no longer
    #            separates "cannot see" from "aiming at the wrong thing")
    scope: obs
    # null -> derive from the eval `seed`, so a sweep's seeds give different
    # noise realisations and each one replays exactly.
    seed: null

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  # Cap on the first evaluated step (null disables it).
  max_start_step: null
  # Only sample starts whose cube moves >= this (metres) between start and goal
  # in the expert data. null samples all starts -- but then ~half the draws
  # are windows where the expert never moves the cube, the episode succeeds at
  # reset no matter the policy (a random policy scores identically to the
  # planner), and success_rate stops measuring planning -- which is why the
  # Random baseline scores ~46% on OGB-Cube. The paper keeps null (the protocol
  # of the image baselines).
  min_goal_displacement: null
  # JSON file with fixed {episodes, start_steps} -- overrides the sampling
  # above entirely (e.g. eval_starts/starts_cube_seed<S>.json, the pinned lists).
  starts_file: null
  # MUST equal the dataset's stored pixel resolution: the live pixels buffer is
  # written in place each step and must match the dataset-injected pixels
  # column shape, else the rollout crashes on a shape mismatch. Videos are only
  # a secondary consumer.
  img_size: 224
  dataset_name: ${oc.env:PLWM_DATA_ROOT,data}/cube.lance
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    # -- set target pos (goal_* keys come from the dataset slice end state)
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat

output:
  # directory for results + videos. null -> alongside the checkpoint
  # (<cache_dir>/checkpoints/<policy dir>), or this script's dir for the
  # random policy. Override on the CLI with output.dir=/path/to/out.
  dir: ${oc.env:PLWM_RESULTS_ROOT,eval_results}
  filename: lidar_cube_results.txt
