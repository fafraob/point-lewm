defaults:
  - launcher: local
  - solver: cem
  - _self_

# Vox-WM closed-loop eval on REACHER -- the geometric-baseline sibling of
# utoniawm_reacher.yaml. Same protocol as lidar_reacher.yaml (same dataset,
# sensor, sampling and CEM settings), so with equal (num_eval, goal_offset,
# max_start_step, seed) the sampled (episode, start) sequences are
# BYTE-IDENTICAL across arms.
#
# THE ENV IS NOT swm/ReacherDMControl-v0 -- see lidar_reacher.yaml: the lidar
# dataset was written against swm/Reacher3D-v0 (the 3D re-skin of the dm_control
# two-link reacher), and `world.iso_*` + `lidar.sensor` below are copied from
# the config that GENERATED the dataset (stable-worldmodel scripts/data/config/
# lidar_from_h5_reacher.yaml) (part of the vendored stable-worldmodel/).
#
# SCORING is the env's, exactly as in lidar_reacher.yaml / utoniawm_reacher.yaml:
# swm/Reacher3D-v0 implements the dm_control qpos_match rule, armed by the
# set_target_qpos callable below -- both pieces are required (swm's
# _apply_callables silently skips a method the env lacks, which would report a
# 0.0 success_rate without erroring).
#
# The encoder is parameter-free (pc_encoders/voxstats_encoder.py): live clouds
# are reduced to per-cell statistics in microseconds -- no checkpoint, no
# cache. Planning cost is MSE in the fixed statistics token space.
#
# Run one seed:      pixi run eval-lidar --config-name=voxstats_reacher run=<run>

world:
  env_name: swm/Reacher3D-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set by eval_lidar.py to 2 * eval_budget
  # One stored dataset row is two 0.02 s physics substeps (measured by
  # re-simulating recorded transitions); see lidar_reacher.yaml's frame_skip
  # block.
  frame_skip: 2
  # Oblique sensor bearing (the scan inherits the iso camera's fov). No goal
  # object exists in this scene, so there is no goal_lidar_height to set,
  # unlike the two-room / pusht mirrors.
  iso_azimuth: 45.0
  iso_elevation: 45.0

dataset:
  # columns to z-score and expose to the policy (lidar is used raw)
  stats_keys:
    - action

seed: 42
# cem only: voxstats has no action decoder, so the ldad/ldad_cem planners of
# the point_delta_jepa arm cannot apply (eval_lidar.py refuses them without one).
planner: cem
# ckpt path relative to <run>/checkpoints/. weights_epoch_100.pt is the
# 100-epoch protocol's final export; weights_epoch_10.pt is the equal-budget
# point vs point_lewm/point_delta_jepa.
policy: voxstats_reacher/weights_final.pt
# run: null -> newest run under logs_root; else the stamped run folder, e.g.
# run=voxstats_reacher
logs_root: ${oc.env:PLWM_LOGS_ROOT,experiment_logs}
run: null
cache_dir: null

# must match training: history_size=3 frames, frameskip=5 (action_block,
# == config/train/data/lidar_reacher.yaml)
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

lidar:
  key: lidar # env info key; the dataset goal arrives as goal_${.key}
  in_channels: 3
  # Geometry-only arm: no colors are packed, panels render depth-colored.
  contains_rgb: false
  # Points with all coords == this are dropped before encoding -- MUST match
  # the training pipeline (data/lidar_reacher.yaml: invalid_value -1.0).
  invalid_value: -1.0
  # AddRaycastLidarWrapper kwargs == lidar_from_h5_reacher.yaml's `lidar` block,
  # copied from lidar_reacher.yaml (the exact sensor that generated the dataset).
  sensor:
    h_res: 100
    v_res: 100
    match_camera_fov: true # ray grid comes from the iso camera's fov
    # This scene is a native MuJoCo model rebuilt once, so `warp` would work
    # too; `mujoco` keeps it identical to the two-room / pusht arms.
    backend: mujoco
    mount_camera: iso
    frame: sensor
    max_range: 4.0 # workspace is ~0.6 m across; the eye sits 0.80 m out
    miss_value: -1.0 # sensor property; invalid_value above decides dropping
    include_static: true
    add_goal_lidar: false # goal clouds come from the dataset
    add_rgb: false # no colors in this dataset
  # Eval-time sensor degradation -- the noise / dropout ablations. NOT part of
  # `sensor` above: that block reproduces the scan that generated the training
  # dataset and must stay faithful to it, while this one deliberately makes the
  # scan worse to measure how far the world model survives it. Defaults are
  # no-ops, so an unmodified eval behaves exactly as before.
  perturb:
    # Gaussian range noise (along each point's line of sight), sigma as a
    # FRACTION of that frame's scan bounding-box diagonal. Relative because an
    # absolute sigma is not comparable across these arenas -- 2 cm is a haze on
    # Push-T (4.9 m across) and a catastrophe on reacher (1.4 m).
    #   0.0025 -> ~0.33x the median point spacing in every env
    #   0.005  -> ~0.67x the spacing; surfaces soften but stay surfaces
    # Both stay BELOW the spacing on purpose: past it a point lands nearer a
    # different surface than its own and the scan dissolves rather than
    # degrades (at noise_frac 0.02 the Reacher scan dissolves and planning
    # largely fails).
    noise_frac: 0.0
    # Fraction of returns marked as misses. They leave through the same
    # invalid_value filter as genuine misses, so the model simply sees fewer
    # points -- which is what a lost return is.
    dropout_prob: 0.0
    # What gets degraded. The goal cloud comes from the DATASET, not the
    # sensor, so it stays clean unless asked for:
    #   obs   -- live observation only (bad sensor, stored target)
    #   both  -- goal too (tests the representation, but a failure no longer
    #            separates "cannot see" from "aiming at the wrong thing")
    scope: obs
    # null -> derive from the eval `seed`, so a sweep's seeds give different
    # noise realisations and each one replays exactly.
    seed: null

# evaluation from dataset (replay expert trajectories)
# evaluation from dataset (replay expert trajectories)
eval:
  # 50 episodes per seed. Also the number of parallel MuJoCo envs.
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  # Kept at the lidar_reacher.yaml value so the sampled sequences match that
  # arm's evals (see header). eval.min_goal_displacement is CUBE-ONLY.
  max_start_step: null
  # JSON file with fixed {episodes, start_steps} -- overrides the sampling
  # above entirely.
  starts_file: null
  img_size: 224 # must equal the stored pixels resolution
  dataset_name: ${oc.env:PLWM_DATA_ROOT,data}/reacher.lance
  # Identical to config/eval/lidar_reacher.yaml's callables -- env API calls,
  # and both resolve on Reacher3DEnv itself: set_state, and set_target_qpos,
  # the qpos-match goal test the env implements (vendored stable-worldmodel).
  # goal_qpos is the dataset row at start + goal_offset_steps -- the SAME row
  # the goal point cloud comes from, so the success test and the planning
  # target cannot disagree.
  #
  # NOTE swm's _apply_callables SKIPS a method the env does not have, and does
  # it silently: against a stable-worldmodel whose Reacher3D lacks
  # set_target_qpos, the call is ignored and every episode scores as a failure
  # instead of erroring.
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    # -- set the goal pose the episode is scored against
    - method: set_target_qpos
      args:
        target_qpos:
          value: goal_qpos

output:
  # directory for results + videos. scripts/run_sweep.sh sets this per (checkpoint, seed).
  dir: ${oc.env:PLWM_RESULTS_ROOT,eval_results}
  filename: voxstats_reacher_results.txt
  # false skips the per-episode panel videos (output.video=false on the CLI).
  video: true
